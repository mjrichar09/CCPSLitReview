name: CI

# Tests run over recorded fixtures — no network, no LLM calls — so this is cheap
# enough to run on every push. Three of the bugs this repo has already shipped
# and fixed (a silent throttle truncation, a temporal dead zone in the fetch
# helper, a dropped exit guard) were the kind a green test run catches.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The viewer is SSG and reads committed JSON at build time, so a broken
      # report shape fails the build rather than the deployed page.
      - run: npm run build
